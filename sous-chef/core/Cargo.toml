[package]
name = "sous-core"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
memchr.workspace = true
# The zero-dependency leaf `BookKey` lives in, so sous-core needs no onion.
mise = { path = "../../mise" }
rustc-hash.workspace = true
# The word row keys by hash: words fit a u64 only 12-23% of the time outside
# Latin (evidence.md, 2026-09-02), so a packed key is not available.
xxhash-rust.workspace = true

[features]
# Bench-only: divan's AllocProfiler as the global allocator, so the substrate
# rows show their allocations per chapter. See onion's.
alloc-counts = []

[dev-dependencies]
divan = "0.1.21"
# Oracle only. `sous-core` ships no segmenter; this pins the atom rule's
# "never split a cluster" claim against UAX #29 at the same Unicode version
# as `testdata/ucd/`.
unicode-segmentation = "1.13.3"

[[bench]]
name = "roofline"
harness = false
