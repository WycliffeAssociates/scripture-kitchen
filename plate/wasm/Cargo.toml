[package]
name = "plate-wasm"
version = "0.0.0"
edition = "2024"
publish = false
description = "plate in the browser: onion and Typst in one wasm module."

[lib]
crate-type = ["cdylib"]

[dependencies]
plate = { path = "..", default-features = false }
wasm-bindgen = "0.2"
serde_json = "1"
comemo = "0.5.1"
# getrandom's js backend, which wasm32-unknown-unknown needs if anything asks.
getrandom = { version = "0.3", features = ["wasm_js"] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
