[workspace]
# The five-crate layout, each in its own named directory:
# `onion` (piece 1, the engine), `onion-wasm` (piece 2, the JS bindings —
# wasm-bindgen + js-sys + serde; the engine never depends on it, and none of
# its dependencies reach onion/src), `galley` (piece 5, the workflows crate:
# depends on the engines and NEVER the reverse).
members = ["onion", "onion-wasm", "galley"]
resolver = "2"

# One CGU so two builds of the same source produce the same code: a bench that
# wobbles on CGU partitioning measures the compiler. Thin LTO is what carries
# galley -> onion::{lex, cst::build, lint} and onion-wasm -> onion — non-generic
# `pub fn`s, invisible to the caller's inliner without it.
#
# No `debug`: it never changed codegen, but on macOS it strands the DWARF in
# target/'s object files and leaves the binary non-relocatable for symbolication.
# `bench` inherits this and must NOT diverge — both write to target/release, so
# differing flags refingerprint on every release/bench alternation.
[profile.release]
codegen-units = 1
lto = "thin"

# Release codegen plus the least debug info samply needs. Line tables carry
# inline frames, which is the whole profile once LTO inlines `lex`. Custom, so
# it gets target/profiling/ and never thrashes against release.
#     cargo bench --profile profiling --no-run
#     samply record -- target/profiling/deps/pipeline-<hash> lex::serial
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
