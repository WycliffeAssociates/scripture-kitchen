[package]
name = "usfm_onion_2"
version = "0.1.0"
edition = "2024"

[dependencies]
memchr = "2.8.3"
winnow = "1.0.4"
# Playground-only parallelism (dev-deps don't reach src/bin binaries, so:
# optional dep + feature, cfg-gated in the playground, absent from the lib).
rayon = { version = "1.10", optional = true }

[features]
default = ["usj"]
par = ["dep:rayon"]
# Exports are compile-time optional (sketches/usj-export.md): a size-sensitive
# consumer sets `default-features = false` and the module is not in the binary.
usj = []

[dev-dependencies]
criterion = "0.8.2"
# ORACLE-SIDE ONLY. The library writes JSON by hand (no serde in src/); the
# corpus test needs to PARSE testData's fixtures to compare as `Value`.
serde_json = "1.0"
# Integration tests DO see dev-deps (unlike src/bin — see rayon note above),
# so tests get parallelism without the `par` feature or touching the lib.
rayon = "1.10"

[profile.release]
debug = true
