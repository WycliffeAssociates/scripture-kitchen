[workspace]
# The five-crate layout, each in its own named directory:
# `onion` (piece 1, the engine), `onion-wasm` (piece 2, the JS bindings —
# wasm-bindgen + js-sys + serde; the engine never depends on it, and none of
# its dependencies reach onion/src), `galley` (piece 5, the workflows crate:
# depends on the engines and NEVER the reverse).
#
# `mise` is the LEAF beneath all of them: zero dependencies, spec data tables
# and borrow-free data structures only. It is how onion and sous-core share
# `BookKey` and the UTF-16 offset types without sharing each other.
#
# sous-chef/ is a separate product sharing the workspace: `sous-core` (the
# count substrate, no dependency on onion — it takes a neutral borrowed view)
# and `sous-cli`, the adapter that may depend on both. galley also depends on
# sous-core: `galley::sous` is where the two engines meet for coordinate
# rebasing and findings publication. See sous-chef/charter.md.
# sous-chef/donor/ is NOT a crate — it is the v1 spike's source, kept to read
# and port from by hand.
#
#   mise ◄── onion ◄── onion-wasm            mise ◄── sous-core
#      ▲        ▲                                        ▲
#      ╰────────┴──────────── galley ◄──────────────────╯
members = [
    "mise",
    "onion",
    "onion-wasm",
    "galley",
    "sous-chef/core",
    "sous-chef/cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"

# Pinned here rather than per-crate so one version is stated once. These are
# exactly what Cargo.lock resolves; a bump is a deliberate edit in one place.
[workspace.dependencies]
memchr = "2.8.3"
rayon = "1.12.0"
rustc-hash = "2.1.3"
usage = { package = "usage-rs", version = "6" }
# xxh3, for onion's per-dish source hash and galley's chunk checksums.
# no_std-friendly, wasm-clean.
xxhash-rust = { version = "0.8", features = ["xxh3"] }

# std::collections::{HashMap,HashSet} default to SipHash, an adversarial-DoS
# hash we never need: content keys go through xxhash3, everything else through
# rustc-hash. Banned in clippy.toml; crates opt in with `[lints] workspace = true`.
[workspace.lints.clippy]
disallowed_types = "deny"

# One CGU so two builds of the same source produce the same code: a bench that
# wobbles on CGU partitioning measures the compiler. Thin LTO is what carries
# galley -> onion::{lex, cst::build, lint} and onion-wasm -> onion — non-generic
# `pub fn`s, invisible to the caller's inliner without it.
#
# No `debug`: it never changed codegen, but on macOS it strands the DWARF in
# target/'s object files and leaves the binary non-relocatable for symbolication.
# `bench` inherits this and must NOT diverge — both write to target/release, so
# differing flags refingerprint on every release/bench alternation.
[profile.release]
codegen-units = 1
lto = "thin"

# Release codegen plus the least debug info samply needs. Line tables carry
# inline frames, which is the whole profile once LTO inlines `lex`. Custom, so
# it gets target/profiling/ and never thrashes against release.
#     cargo bench --profile profiling --no-run
#     samply record -- target/profiling/deps/pipeline-<hash> lex::serial
[profile.profiling]
inherits = "release"
debug = "line-tables-only"

# The test suite sweeps tens of MB of scripture; at opt-level 0 that is minutes
# of wall per run. Level 1 keeps `debug_assertions` on (the reason the debug leg
# exists) and costs little compile time. `test` inherits `dev`, but state it so
# a future `dev` edit cannot silently drop it from test binaries.
[profile.dev]
opt-level = 1

[profile.test]
opt-level = 1
