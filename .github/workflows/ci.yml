name: ci

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# A master run may be committing packages back, tagging and publishing; a newer
# push queues behind it instead of cancelling it halfway through a release.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: fmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      # bttwriter's libgit2 adapter is off by default, so the pass above never
      # compiles it.
      - name: clippy (bttwriter's git2 feature)
        run: cargo clippy -p bttwriter --all-targets --features git2 -- -D warnings

      # onion/Cargo.toml advertises usj/usx/html as compile-time optional, and
      # every other job builds them all ON. Without this, no build in CI ever
      # has one OFF, so `default-features = false` is an untested promise.
      # All-off plus each single is the complete set: the three gates are
      # independent `pub mod` lines and no gated module references another, so
      # a pair could only fail if a single already did.
      - name: feature permutations
        run: |
          for f in "" usj usx html; do
            echo "::group::--no-default-features --features '$f'"
            cargo check -p usfm_onion --no-default-features --features "$f"
            echo "::endgroup::"
          done

      # galley's `wasm` feature is the both-doors-one-module build. It only ever
      # links for wasm32, so a native clippy pass never sees it.
      - name: galley wasm feature compiles
        run: cargo check -p usfm_galley --features wasm --target wasm32-unknown-unknown

      # bento's, bttwriter's and docx's JS doors, likewise wasm32-only; clippy
      # over them too, since no native pass compiles `src/wasm.rs`.
      - name: bento, bttwriter and docx wasm features
        run: |
          cargo clippy -p bento --features wasm --target wasm32-unknown-unknown -- -D warnings
          cargo clippy -p bttwriter --features wasm --target wasm32-unknown-unknown -- -D warnings
          cargo clippy -p docx --features wasm --target wasm32-unknown-unknown -- -D warnings

  # The inner-loop suite, in DEBUG on purpose: two dozen `debug_assert!`s across
  # the engine only fire here. It also includes codegen_output_matches_input, so
  # a row edited without `cargo run --bin codegen` fails in this job — no
  # separate regenerate-and-diff step is needed for generated.rs,
  # wire/generated.rs, diagnostics.json or reader.ts.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: cargo test --workspace
      # The libgit2 adapter and the test that it agrees with the git command.
      - run: cargo test -p bttwriter --features git2

  # The JS side of the wall. Node 24 because conformance.mjs imports reader.ts
  # directly and leans on type stripping — there is no build step by design.
  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          cache-key: wasm
      - uses: ./.github/actions/wasm-tools
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: boundary test
        working-directory: onion-wasm
        run: wasm-pack test --node

      - name: build a node package
        working-directory: onion-wasm
        run: wasm-pack build --target nodejs --release --weak-refs --out-dir pkg-node

      - name: reader/writer conformance
        run: node onion-wasm/tests/conformance.mjs onion-wasm/pkg-node testData/exampleCorpora/en_ulb

      # galley's wall: the same three publications the native goldens pin, but
      # through the JS handle inside linear memory.
      - name: galley wall test
        working-directory: galley
        run: wasm-pack test --node --features wasm --test wasm_wall

      - name: build a galley node package
        working-directory: galley
        run: wasm-pack build --target nodejs --release --out-dir pkg-node -- --features wasm

      # Asserts the EXACT export list, so an onion door that stopped linking
      # into the galley module fails here rather than going quiet. With the
      # corpus it also prints the keystroke lifecycle.
      - name: galley sous conformance
        run: node galley/tests/sous_conformance.mjs galley/pkg-node testData/exampleCorpora/en_ulb

      - name: galley reference conformance
        run: node galley/tests/reference_conformance.mjs galley/pkg-node

      # Every .ts the package ships, type-checked as Sefer compiles it (Sefer
      # checks them as its own source). The compiler is pinned in
      # tools/typecheck to Sefer's; the settings are ../../tsconfig.json.
      - name: typecheck the shipped TypeScript
        run: |
          npm ci --prefix tools/typecheck
          npm run --prefix tools/typecheck check

      # bento.ts, bttwriter.ts and docx.ts as shipped, over freshly built
      # modules: the same claims as the Rust tests, through the wall.
      # bttwriter's reads the five fixture repos through isomorphicGitSource and
      # checks Sefer's head ids and a consolidated pack with `git fsck`. (These builds skip the
      # path remapping; the artifacts job checks the committed bytes.)
      - name: bento conformance
        run: |
          (cd bento && wasm-pack build --target web --release --weak-refs --out-dir pkg-web -- --features wasm)
          node bento/tests/conformance.mjs

      - name: bttwriter conformance
        run: |
          (cd bttwriter && wasm-pack build --target web --release --weak-refs --out-dir pkg-web -- --features wasm)
          node bttwriter/tests/conformance.mjs

      - name: docx conformance
        run: |
          (cd docx && wasm-pack build --target web --release --weak-refs --out-dir pkg-web -- --features wasm)
          node docx/tests/conformance.mjs

      # The reader TypeScript ships unbuilt, so its own tests are the only
      # thing that type-checks and runs it apart from the conformance scripts.
      - name: sous-chef reader tests
        working-directory: sous-chef
        run: npm test

      # canon ships plain TypeScript beside the Rust; both run
      # canon/fixtures/books.json, and this is the TypeScript half.
      - name: canon TypeScript fixtures
        working-directory: canon
        run: npm test

      # The root package.json is DERIVED from galley's and onion-wasm's — an
      # inner export map edited without regenerating it ships a root map that
      # points nowhere, and a stale `sideEffects` is worse than that: silent,
      # and it tree-shakes the wasm glue out of a consumer's bundle.
      - name: root package.json is not stale
        run: |
          node package-root.mjs > /tmp/root.json
          diff -u package.json /tmp/root.json \
            || { echo "::error::run: node package-root.mjs > package.json"; exit 1; }

      # A git install clones the repo and then PACKS it through `files`, so what
      # `npm pack` would emit is exactly what a consumer receives. `files` and
      # `exports` are derived by package-root.mjs from the two inner packages;
      # this catches an export naming something the pack leaves behind.
      # `npm pack --json` emits an array (npm 10, 11) or an object keyed by
      # package name (npm 12); the root package is ESM, so this runs as a module.
      - name: a git install carries every exported path
        run: |
          npm pack --dry-run --json > /tmp/pack.json
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const read = (p) => JSON.parse(readFileSync(p, "utf8"));
            const packs = read("/tmp/pack.json");
            const { files } = Array.isArray(packs) ? packs[0] : Object.values(packs)[0];
            const packed = new Set(files.map((f) => f.path));
            const targets = new Set();
            const walk = (v) =>
              typeof v === "string"
                ? targets.add(v)
                : Object.values(v ?? {}).forEach(walk);
            walk(read("./package.json").exports);
            const missing = [...targets].filter(
              (p) => !packed.has(p.replace(/^\.\//, "")),
            );
            if (missing.length) {
              console.error("exports not in the tarball:", missing);
              process.exit(1);
            }
            console.log(
              `${packed.size} files packed, all ${targets.size} export targets present`,
            );
          '

  # Every package's pkg-web (and galley's and onion-wasm's pkg-bundler) is COMMITTED — consumers install
  # from a git tag as well as the registry. CI is what builds them: nobody has
  # to reproduce these bytes locally (a native build on a dev box drifted even
  # with every tool pinned). So:
  # - master: a rebuild that differs is committed back by CI, and `sha` names
  #   the commit that holds fresh packages — the one `tag` releases.
  # - a pull request: a stale package is a warning; merging rebuilds it.
  # - a tag pushed by hand: the tag's own bytes ship, so stale fails.
  artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.fresh.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          cache-key: wasm
      - uses: ./.github/actions/wasm-tools

      # The same scripts a developer runs. They export the --remap-path-prefix
      # flags that make the .wasm host-independent, so they are not optional:
      # the raw wasm-pack lines produce different bytes.
      - name: rebuild every package
        run: |
          ./onion-wasm/build.sh
          ./galley/build.sh
          ./bento/build.sh
          ./bttwriter/build.sh
          ./docx/build.sh

      - name: what moved
        run: |
          git diff --stat -- \
            onion-wasm/pkg-web onion-wasm/pkg-bundler \
            galley/pkg-web galley/pkg-bundler \
            bento/pkg-web bttwriter/pkg-web docx/pkg-web

      - name: packages are fresh
        id: fresh
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -- onion-wasm/pkg-web onion-wasm/pkg-bundler galley/pkg-web galley/pkg-bundler \
            bento/pkg-web bttwriter/pkg-web docx/pkg-web
          if git diff --quiet -- "$@"; then
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$EVENT:$REF" in
            push:refs/heads/master)
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add -- "$@"
              git commit -q -m "pkg: wasm rebuilt by CI for ${GITHUB_SHA::7}"
              # A push made with GITHUB_TOKEN starts no workflow, so this commit
              # does not loop. If master moved meanwhile, the newer run rebuilds.
              if git push origin HEAD:refs/heads/master; then
                echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              else
                echo "::warning::master moved during the rebuild; the newer run commits its packages"
              fi
              ;;
            push:refs/tags/*)
              echo "::error::a hand-pushed tag ships its committed packages, and they are stale — push the version to master and let CI tag it"
              exit 1
              ;;
            *)
              echo "::warning::committed packages are stale; CI rebuilds them when this lands on master"
              ;;
          esac

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pkg-rebuilt
          path: |
            onion-wasm/pkg-web
            onion-wasm/pkg-bundler
            galley/pkg-web
            galley/pkg-bundler
            bento/pkg-web
            bttwriter/pkg-web
            docx/pkg-web

  # The sixteen `#[ignore]`d oracles, each naming a claim nothing else makes:
  # galley's whole-Bible publication laws, mise's UTF-16 boundary sweep of the
  # sous tier and onion's of the whole test tier, and sous-core's four
  # 8-corpus reference walks. Release keeps
  # them out of the local gate's budget; the whole suite here is ~11s warm, so
  # it runs on every event, pull requests included. `test` is still its own job
  # and not redundant: it carries the debug_assert!s release compiles out.
  oracles:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          cache-key: release
      - run: cargo test --workspace --release -- --include-ignored

  # A release is a version bump pushed to master. When the manifests name a
  # version with no tag yet and every gate is green, CI tags the commit that
  # holds the fresh packages, with the version commit's message as the notes,
  # and the jobs below release it in this same run. (A tag pushed with
  # GITHUB_TOKEN starts no workflow of its own.)
  tag:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.artifacts.outputs.sha != ''
    needs: [lint, test, wasm, artifacts, oracles]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.artifacts.outputs.sha }}
          fetch-depth: 0

      - name: tag a new version
        id: tag
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "$tag already exists"
            exit 0
          fi
          # The notes are the message of the commit that set this version.
          bump=$(git log -1 --format=%H -G '^version = ' -- Cargo.toml)
          git log -1 --format=%B "$bump" | grep -vE '^(Co-Authored-By|Claude-Session):' > /tmp/notes
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -F /tmp/notes
          git push origin "refs/tags/$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  # Cargo consumers install from the tag; npm consumers from the org Nexus
  # (the publish job below) or the tag. So a tag becomes a Release only once the
  # committed packages were proven fresh and the exhaustive oracles were green.
  # The Release itself carries no artifact: the tag already holds everything.
  release:
    if: ${{ !cancelled() && !failure() && (startsWith(github.ref, 'refs/tags/v') || needs.tag.outputs.tag != '') }}
    needs: [lint, test, wasm, artifacts, oracles, tag]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.tag.outputs.tag || github.ref_name }}
    outputs:
      tag: ${{ needs.tag.outputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # The tarball is named from package.json's version, and a Cargo consumer
      # pins the crate version — so a tag whose manifests disagree with it ships
      # something that calls itself the wrong thing.
      - name: manifests agree with the tag
        run: |
          want="${TAG#v}"
          fail=0
          for f in onion/Cargo.toml onion-wasm/Cargo.toml galley/Cargo.toml; do
            got=$(sed -n 's/^version = "\(.*\)"/\1/p' "$f" | head -1)
            [ "$got" = "$want" ] || { echo "$f is $got, tag says $want"; fail=1; }
          done
          for f in package.json onion-wasm/package.json galley/package.json bento/package.json bttwriter/package.json docx/package.json; do
            got=$(node --input-type=commonjs -p "require('./$f').version" < /dev/null)
            [ "$got" = "$want" ] || { echo "$f is $got, tag says $want"; fail=1; }
          done
          # A published crate names its siblings by these versions, not by path.
          stale=$(git grep -nE 'path = "[^"]+", version = "' -- '*Cargo.toml' | grep -v "version = \"$want\"" || true)
          [ -z "$stale" ] || { echo "path dependencies not at $want:"; echo "$stale"; fail=1; }
          exit $fail

      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        # The notes are the annotated tag's message. A shallow checkout can
        # leave the tag without its annotation, so fetch it whole first.
        run: |
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          if gh release view "${TAG}" > /dev/null 2>&1; then
            echo "${TAG} is already released"
            exit 0
          fi
          gh release create "${TAG}" \
            --title "${TAG}" \
            --notes-from-tag

  # The root package to the org Nexus (publishConfig.registry), as the
  # ci-publisher user. The committed pkg-* dirs are what ships, so nothing is
  # built here; `release` has already checked the tag against every manifest.
  # Re-running a tag is safe: a version already on the registry is skipped.
  publish:
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Source secrets
        uses: 1password/load-secrets-action@v3
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          NEXUS_NPM_TOKEN: "op://DevOps/Nexus Registry CI/Saved on nexus-registry.walink.org/npmToken"

      - name: publish
        run: |
          registry=$(node -p "require('./package.json').publishConfig.registry")
          name=$(node -p "require('./package.json').name")
          echo "//${registry#https://}:_authToken=${NEXUS_NPM_TOKEN}" > "$HOME/.npmrc"
          if npm view "${name}@${TAG#v}" version --registry "$registry" > /dev/null 2>&1; then
            echo "${name}@${TAG#v} is already on ${registry}"
            exit 0
          fi
          npm publish

  # The crates to the org Nexus (wa-cargo in .cargo/config.toml), leaves first
  # so each finds its siblings already indexed. Nexus's free edition has no
  # cargo tokens: the token is HTTP Basic over ci-publisher's login.
  # Re-running a tag is safe: a crate whose version is indexed is skipped.
  publish-crates:
    needs: [release]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: ./.github/actions/setup
        with:
          cache-key: publish

      - name: Source secrets
        uses: 1password/load-secrets-action@v3
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          NEXUS_USER: "op://DevOps/Nexus Registry CI/emailAddress"
          NEXUS_PASSWORD: "op://DevOps/Nexus Registry CI/password"

      - name: publish
        run: |
          token="Basic $(printf '%s:%s' "$NEXUS_USER" "$NEXUS_PASSWORD" | base64 -w0)"
          echo "::add-mask::${token}"
          export CARGO_REGISTRIES_WA_CARGO_TOKEN="$token"
          index=https://nexus-registry.walink.org/repository/wa-cargo
          want="${TAG#v}"
          # Published, a sibling path dependency must name its registry or cargo
          # looks for it on crates.io (which has an unrelated `mise`). Committed,
          # that key breaks git-tag consumers, who have no wa-cargo configured,
          # so it is added only here, for the upload.
          git ls-files '*Cargo.toml' | xargs sed -i -E 's/(\{ path = "[^"]+", version = "[^"]+")/\1, registry = "wa-cargo"/'
          for crate in mise canon reference bento bttwriter ticket usfm_onion onion-wasm sous-core usfm_galley; do
            path="${crate:0:2}/${crate:2:2}/${crate}"
            if curl -sf -H "Authorization: $token" "$index/$path" | grep -q "\"vers\":\"$want\""; then
              echo "$crate $want is already on wa-cargo"
              continue
            fi
            cargo publish -p "$crate" --registry wa-cargo --allow-dirty
          done
