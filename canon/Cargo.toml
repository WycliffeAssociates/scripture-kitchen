[package]
name = "canon"
version.workspace = true
license.workspace = true
edition.workspace = true
description = "Book identity and numbering: the USFM book table, book names in the gateway languages, and versification schemes."

[lints]
workspace = true

# Only `mise`, for `BookKey`. No serde and no runtime parsing: the tables are
# Rust consts written by `gen-canon` (the `canon-gen` crate in gen/) from
# `data/`, so a crate that depends on canon (onion, for the coverage lints to
# come) gains nothing else.
[dependencies]
mise = { path = "../mise", version = "0.1.21" }

[dev-dependencies]
serde_json = "1.0"
