[package]
name = "usfm_galley"
version = "0.1.3"
edition = "2024"
description = "The workflows crate over the USFM engine and the Sous analysis — the resident handle, and every onion door on one module."

[lints]
workspace = true

[lib]
# cdylib is what `wasm-pack build --features wasm` links; rlib keeps the native
# consumers and `cargo test -p usfm_galley` working against the same code.
crate-type = ["cdylib", "rlib"]

[dependencies]
# The wire vocabulary and the per-record emitters this crate's schema module
# declares against. Generator-only: nothing on a runtime path calls it.
ticket = { path = "../ticket" }
# Literal search: `memmem` over a book's projection (galley/src/find.md).
memchr.workspace = true
# The leaf both engines share: `BookKey`, canonical order, `Utf16Table`.
mise = { path = "../mise" }
usfm_onion = { path = "../onion" }
# The other engine galley coordinates. Never the reverse: sous-core keeps no
# onion dependency and sees only neutral projected coordinates.
sous-core = { path = "../sous-chef/core" }
# xxh3-128 for the content-addressed chunk checksums (vision §13.4:
# xxh3-128-v1).
xxhash-rust.workspace = true
rustc-hash.workspace = true
# Per-publish chapter mapping only, behind `parallel`; galley adds no pool of
# its own and no background work.
rayon = { workspace = true, optional = true }

# The JS doorway, feature-gated so a native consumer pays nothing for it.
# onion-wasm rides in as an rlib, and `wasm::onion` names one symbol out of it
# so the linker pulls the object its shims sit in — one engine copy, both
# doors, one module.
wasm-bindgen = { version = "0.2", optional = true }
onion-wasm = { path = "../onion-wasm", optional = true }
js-sys = { version = "0.3", optional = true }
# JSON for the overlay's three read-only doors, which answer structured rows
# no buffer format would earn. Behind `wasm` only: the native crate computes
# plain Rust structs and links no serializer at all.
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
# The shared staleness reporter, for the gates below. A regular dependency too;
# an integration test sees only dev-dependencies.
ticket = { path = "../ticket" }
divan = "0.1.21"
# Example-only heap profiler (galley/examples/heap_profile.rs): attributes
# live bytes at global max to allocation sites, not just totals.
dhat = "0.3.3"
# `galley/tests/wasm_wall.rs` only, which is `cfg(target_arch = "wasm32")`:
# the same three publications the native pin drives, through the JS handle.
wasm-bindgen-test = "0.3"

[features]
wasm = ["dep:wasm-bindgen", "dep:onion-wasm", "dep:js-sys", "dep:serde", "dep:serde_json"]
# Map a book's missing chapters on rayon's global pool. Opt-in, and the
# published bytes are identical either way — `galley/tests/equivalence.rs`.
parallel = ["dep:rayon"]
# Bench-only: divan's AllocProfiler as the global allocator. See onion's.
alloc-counts = []

[[bench]]
name = "find"
harness = false

[[bench]]
name = "chunks"
harness = false

[[bench]]
name = "expediter"
harness = false

[[bench]]
name = "overlay"
harness = false

# `-O` is wasm-pack's own release default; `--strip-producers` is the addition,
# and it rides in the SAME wasm-opt pass so nothing is re-emitted twice. The
# producers section records which BUILD of wasm-bindgen and walrus processed
# the module, which differs between CLI builds of the same version — the one
# thing that kept the .wasm from being byte-identical across hosts.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ['-O', '--strip-producers']
