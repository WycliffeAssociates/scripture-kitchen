[package]
name = "bento"
version.workspace = true
edition.workspace = true
description = "Scripture containers: BTT Writer, Resource Container and Scripture Burrito manifests, read leniently, checked, created and edited."
# The npm side (pkg-*, the .ts) ships from the repo root; the crate is Rust only.
exclude = ["pkg-*", "*.ts", "*.mjs", "*.json", "build.sh", "fixtures", "schema"]

[lints]
workspace = true

[lib]
# cdylib is what `wasm-pack build --features wasm` links; rlib keeps the
# native crate for bttwriter and the hub.
crate-type = ["cdylib", "rlib"]

[dependencies]
canon = { path = "../canon", version = "0.1.20" }
mise = { path = "../mise", version = "0.1.20" }
serde = "1"
serde_json = "1"
# Lossless YAML: reads every catalog manifest, and (step 3) edits one changing
# only the lines it means to. The smallest YAML crate in wasm, like for like.
yaml-edit = { version = "0.3.6", default-features = false }
# The JS doors (`src/wasm.rs`), for `bento.ts`. Only ever linked for wasm32.
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }

[features]
# The JSON `bento.ts` reads and writes, without the wasm doors: for another
# module (bttwriter's) that takes a project in the same shape.
json = []
wasm = ["json", "dep:wasm-bindgen", "dep:js-sys"]

[dev-dependencies]
jsonschema = { version = "0.60.2", default-features = false }
