[package]
name = "usfm_onion"
version = "0.1.3"
edition = "2024"

[lints]
workspace = true

[dependencies]
# The wire vocabulary and the per-record emitters this crate's schema module
# declares against. Generator-only: nothing on a runtime path calls it.
ticket = { path = "../ticket" }
memchr.workspace = true
# The zero-dependency leaf: the spec's book table and the UTF-16 offset types,
# shared with sous-core without either engine seeing the other.
mise = { path = "../mise" }
rustc-hash.workspace = true
# The diff port's two algorithm layers: Myers over block keys, and the UAX-29
# word / grapheme diff inside a unit. Pure Rust, no_std-friendly, wasm-clean.
similar = { version = "2.7", features = ["unicode"] }
# xxh3-64 of the source, in every dish's header, so a consumer can tell one
# document's parse from another's without holding both texts.
xxhash-rust.workspace = true

[features]
default = ["usj", "usx", "html"]
# Exports are compile-time optional: a size-sensitive
# consumer sets `default-features = false` and the module is not in the binary.
usj = []
usx = []
# Bench-only: installs divan's AllocProfiler as the global allocator. Its
# counters wrap every allocation, so counts and timings are separate runs.
alloc-counts = []
# HTML is a VIEW export: no oracle, no round-trip
# claim, and the same compile-time-optional deal as its two siblings.
html = []

[dev-dependencies]
# The shared staleness reporter, for the gates below. A regular dependency too;
# an integration test sees only dev-dependencies.
ticket = { path = "../ticket" }
divan = "0.1.21"
# ORACLE-SIDE ONLY. The library writes JSON by hand (no serde in src/); the
# corpus test needs to PARSE testData's fixtures to compare as `Value`.
serde_json = "1.0"
# Tests and benches DO see dev-deps (src/bin does not) — the corpus sweeps and
# the whole-corpus bench get parallelism without the lib ever knowing.
rayon.workspace = true
# The dish's source hash, recomputed independently in `wire_roundtrip`.
xxhash-rust.workspace = true

[[bench]]
name = "pipeline"
harness = false

[[bench]]
name = "export"
harness = false

[[bench]]
name = "rewrite"
harness = false
