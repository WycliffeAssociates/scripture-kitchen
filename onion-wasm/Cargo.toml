[package]
name = "onion-wasm"
version = "0.1.6"
edition = "2024"
description = "The JS doorway over the USFM engine — piece 2 of the five-crate layout (bindgen, .d.ts, UTF-16 walls)."

[lints]
workspace = true

[lib]
name = "onion_wasm"
# cdylib is what `wasm-pack build` links; rlib keeps `cargo test -p onion-wasm`
# and a native consumer working against the same code.
crate-type = ["cdylib", "rlib"]

[dependencies]
usfm_onion = { path = "../onion" }
# The `markers.ext` reader and the spec's `\category` vocabulary. Read here so
# the engine never learns a file format; the registry it feeds is onion's.
mise = { path = "../mise" }
# `xxh3`/`xxh3Text`: the hash the dish header stamps, for a host's own bytes.
xxhash-rust.workspace = true
wasm-bindgen = "0.2"
# The plain-object `mask` return. `Object`/`Reflect`/`Uint32Array` only —
# lighter than serde-wasm-bindgen, which would pull serde's derive machinery
# into a path that builds one small object per call.
js-sys = "0.3"
# Serde lives HERE and never in
# the engine. Its one job is the diff skeleton — a cold, modal-open path where
# the old editors' camelCase JSON contract is worth having back verbatim.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# The ONE boundary test (`wasm-pack test --node`). Native tests need nothing.
wasm-bindgen-test = "0.3"

# `-O` is wasm-pack's own release default; `--strip-producers` is the addition,
# and it rides in the SAME wasm-opt pass so nothing is re-emitted twice (a
# second bare pass costs ~440 bytes). The producers section records which BUILD
# of wasm-bindgen and walrus processed the module — a git-hash suffix on one
# CLI build, a different walrus patch on another — and that was the only thing
# keeping the .wasm from being byte-identical across hosts. Verified: with it
# stripped, macOS/arm64 and Linux/arm64 produce the same bytes.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ['-O', '--strip-producers']
