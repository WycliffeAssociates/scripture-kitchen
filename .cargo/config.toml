# The org Nexus. ci.yml's publish-crates job publishes here; a consumer copies
# this table into their own .cargo/config.toml. Nexus marks the index
# auth-required, so cargo wants a token even to read: CARGO_REGISTRIES_WA_CARGO_TOKEN,
# "Basic " + base64 of user:password.
[registries.wa-cargo]
index = "sparse+https://nexus-registry.walink.org/repository/wa-cargo/"
credential-provider = "cargo:token"
