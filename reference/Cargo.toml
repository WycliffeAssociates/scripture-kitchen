[package]
name = "reference"
version.workspace = true
license.workspace = true
edition.workspace = true
description = "A place in scripture, spelled: the Scripture Referencing Standard's basic reference (book, chapter, verse, part, ranges, lists), read and written over mise's Address."

[lints]
workspace = true

# `mise` for Address and BookKey, `canon` for which codes are books and, given a
# scheme, how long chapters are. No text and no onion: whether a text has the
# place is resolve's question.
[dependencies]
mise = { path = "../mise", version = "0.1.24" }
canon = { path = "../canon", version = "0.1.24" }

[dev-dependencies]
serde_json = "1.0"
